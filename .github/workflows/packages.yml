name: Package tests

on:
  push:
    paths:
      - "Packages/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "Packages/**"
      - ".github/workflows/packages.yml"

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        package:
          - MusicCore
          - TelegramClient
          - MusicLibrary
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/${{ matrix.package }}
