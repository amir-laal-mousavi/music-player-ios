name: Package tests

on:
  push:
    paths:
      - "Packages/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "Packages/**"
      - ".github/workflows/packages.yml"

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        package:
          - MusicCore
          - TelegramClient
          - MusicLibrary
    steps:
      - uses: actions/checkout@v4
      - env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ -f "Packages/$PACKAGE/Package.swift" ]; then
            swift test --package-path "Packages/$PACKAGE"
          else
            echo "Skipping $PACKAGE: package not present"
          fi
